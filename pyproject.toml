[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrector-postura-analitica"
version = "0.1.0"
description = "Ingesta, validación, normalización y figuras de registros de un corrector de postura."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "pyyaml>=6",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
postura = "postura.cli:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"postura.web" = ["estatico/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
