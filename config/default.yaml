# Configuración por defecto de corrector-postura-analitica.
# Todo parámetro numérico del proyecto vive aquí. Un archivo pasado con --config
# se fusiona encima de este (solo hace falta escribir las claves que cambian).

# Umbrales de alerta quemados en el firmware (grados enteros).
# Estado derivado: MAL si F > FRONTAL_MAX o F < FRONTAL_MIN o L > LATERAL_MAX o L < LATERAL_MIN.
umbrales:
  FRONTAL_MAX: 25    # inclinación hacia adelante
  FRONTAL_MIN: -10   # inclinación hacia atrás
  LATERAL_MAX: 15    # inclinación a la derecha
  LATERAL_MIN: -15   # inclinación a la izquierda

rutas:
  salidas: salidas   # el log de ingesta se escribe como ingesta.log junto al parquet de salida

ingesta:
  codificacion: utf-8-sig   # UTF-8; tolera BOM inicial

# Identificación del usuario. El formato actual no trae identificador, así que
# se resuelve en este orden: mapa explícito por nombre de archivo → patrón sobre
# el nombre de archivo → valor por defecto.
usuarios:
  mapa_archivos: {}                      # p. ej. {"registro_ana.txt": "U01"}
  patron_archivo: '^(?P<usuario>U\d+)[_-]'  # p. ej. U01_2026-10-31.txt
  por_defecto: desconocido

# Fecha del registro. Las líneas solo traen HH:MM:SS.mmm, así que la fecha se
# toma del nombre de archivo o de aquí. Si no hay ninguna, se usa fecha_marcador
# y la sesión queda con la bandera fecha_desconocida (la hora sigue siendo válida).
fecha:
  patron_archivo: '(?P<fecha>\d{4}-\d{2}-\d{2})'
  por_defecto: null                      # "AAAA-MM-DD" o null
  fecha_marcador: "1900-01-01"
  # Si la hora retrocede más que esto entre líneas consecutivas, se asume
  # cruce de medianoche y se suma un día.
  retroceso_medianoche_s: 43200

sesiones:
  incluir_sin_calibrar: false
  # Con varios CALIBRADO en una sesión, el cero que vale es el del último:
  # las muestras previas a él quedan con post_calibracion = False.
  # Valores: "ultima" | "primera".
  calibracion_multiple: ultima

calidad:
  cadencia_nominal_s: 1.0
  # Un intervalo entre muestras mayor que esto cuenta como hueco.
  umbral_hueco_s: 2.5
  # Un intervalo menor que esto cuenta como muestra en ráfaga (posible duplicado).
  umbral_rafaga_s: 0.5

figura:
  metodo: kde            # kde | hex | auto
  auto_umbral_muestras: 20000   # con metodo=auto, a partir de aquí se usa hex
  paleta: viridis        # secuencial, perceptualmente uniforme
  dpi: 300
  formatos: [png, svg]
  tamano_pulgadas: [8.0, 7.5]
  proporcion_marginal: 0.22     # fracción del alto/ancho para los histogramas marginales
  margen_vista_grados: 5        # margen alrededor de datos y umbrales
  ancho_pie_caracteres: 120     # ajuste de línea del pie de figura
  kde:
    min_muestras: 3             # por debajo, no se estima densidad kernel
    ancho_banda: scott          # scott | silverman | número
    resolucion_malla: 200
    niveles: 12
    fraccion_minima_nivel: 0.02 # niveles por debajo de esta fracción del máximo no se rellenan
    tamano_punto_aislado: 9     # muestras en zonas sin relleno se dibujan como puntos (pt²)
  hex:
    tamano_malla: 30
    min_conteo: 1
  histograma:
    ancho_bin_grados: 1
  umbral_rectangulo:
    grosor_linea: 1.4
    patron: [4, 3]              # guiones (largo, espacio) en puntos
  # Vista 3D (sección 4.3): la misma densidad del mapa 2D como superficie.
  tres_d:
    resolucion_malla: 80        # puntos por eje de la superficie (la vista 2D usa resolucion_malla de kde)
    decimales_z: 4
    elevacion_grados: 32        # ángulo de cámara de la imagen descargable
    azimut_grados: -58
    tamano_pulgadas: [8.5, 7.5]
    proporcion_altura: 0.6      # alto del eje Z respecto al ancho, en la vista interactiva
    plotly_cdn: "https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"

# Análisis ergonómico (pestaña "Análisis ergonómico" de la web).
# Fuente: German BGIA-Report 2/2007 según ISO 11226 y EN 1005-4, tal como se
# presenta en "Posture Analysis During Desk Work of Researchers" (Betancur, UMB).
# α = frontal (F, flexión/extensión del tronco), β = lateral (L, inclinación).
ergonomia:
  fuente: "BGIA-Report 2/2007 · ISO 11226 · EN 1005-4"
  # Zonas del plano lateral × frontal. Se evalúan en orden y gana la primera que
  # contiene el punto (intervalos cerrados); fuera de todas → postura extrema.
  zonas:
    - {nivel: optima,    frontal: [0, 20],  lateral: [-10, 10]}
    - {nivel: aceptable, frontal: [0, 20],  lateral: [-20, 20]}
    - {nivel: aceptable, frontal: [20, 60], lateral: [-.inf, .inf]}
  # Clasificación de cada ángulo por separado (histogramas de frecuencia).
  zonas_1d:
    frontal: {optima: [0, 20],   aceptable: [20, 60]}
    lateral: {optima: [-10, 10], aceptable: [-20, 20]}
  nombres_zona: {optima: Postura óptima, aceptable: Postura aún aceptable, extrema: Postura extrema}
  colores_zona: {optima: "#cfeccb", aceptable: "#f7d774", extrema: "#f2836b"}     # fondo de zonas
  colores_barra: {optima: "#3f9b4f", aceptable: "#d9a400", extrema: "#d64a2b"}    # barras de histograma
  alfa_zonas: 0.55
  # Franjas horarias [desde, hasta) en horas. Si desde > hasta, la franja cruza medianoche.
  momentos:
    manana: {nombre: Mañana, desde: 6,  hasta: 12}
    tarde:  {nombre: Tarde,  desde: 12, hasta: 18}
    noche:  {nombre: Noche,  desde: 18, hasta: 6}
  # Comparación entre momentos (ANOVA de un factor sobre σG y RG). Cada observación
  # es un tramo sesión × momento con al menos min_muestras_tramo muestras.
  anova:
    min_muestras_tramo: 30
    alfa: 0.05
  paleta: magma_r               # claro = poco tiempo, oscuro = mucho tiempo
  rango_grados: [-30, 30]       # vista por defecto en ambos ejes; se amplía si hay datos fuera
  silueta: true                 # persona vista desde arriba, como referencia de orientación
  color_silueta: "#6b7280"
  color_dispersion: "#d1242f"   # círculo |σ|
  color_desplazamiento: "#1a7f37"   # flecha |R|
  alfa_densidad: 0.8
  columnas_cuadricula: 4        # figura por sujeto
  max_paneles: 24
  tamanos_pulgadas:
    zonas: [8.0, 7.8]
    momentos: [13.0, 5.2]
    sujeto_panel: [3.1, 3.1]
    histogramas: [12.0, 4.6]

# Análisis descriptivo de patrones angulares (sección 4.3 de la web).
# Estadística descriptiva de F y L separada por el estado que reporta el dispositivo.
estadistica:
  percentiles: [5, 25, 50, 75, 95]
  colores_estado: {BIEN: "#2f8f46", MAL: "#c2410c"}
  colores_angulo: {frontal: "#3b528b", lateral: "#b07d00"}
  alfa_histograma: 0.6
  ancho_bin_grados: 1
  min_muestras_violin: 5         # con menos, se dibujan los valores en lugar de una densidad
  max_sesiones_serie: 8          # filas de la figura de series temporales
  formatos_descarga: [png, svg, pdf]
  tamanos_pulgadas:
    histogramas: [12.0, 5.0]
    cajas: [11.0, 5.2]
    violin: [11.0, 5.2]
    serie_fila: [12.0, 2.3]      # alto por sesión
    reporte_pagina: [11.0, 8.5]  # carta horizontal

# Filtro previo: un archivo que no lo pasa se rechaza y NO se procesa.
validacion:
  extensiones_permitidas: [.txt]
  bytes_revision_binaria: 8192   # se busca un byte nulo en este tramo inicial
  lineas_muestra_formato: 50     # al menos una de estas primeras líneas debe tener HH:MM:SS.mmm

web:
  host: 127.0.0.1        # solo accesible desde este equipo
  puerto: 8000
  max_mb_subida: 4              # total por subida; Vercel no acepta peticiones de más de 4,5 MB
  max_hallazgos_por_codigo: 50  # hallazgos listados por tipo (el conteo siempre es completo)
  formatos_descarga: [png, svg, pdf, jpg]

estilo:
  fuente: DejaVu Sans
  tamano_base: 9
  tamano_titulo: 11
  tamano_pie: 7.5
  tamano_rotulo: 9
  color_fondo: "#ffffff"
  color_texto: "#1f2328"
  color_texto_secundario: "#59636e"
  color_malla: "#e6e8eb"
  color_umbral: "#c2410c"
  color_histograma: "#3b528b"
  alfa_histograma: 0.85
